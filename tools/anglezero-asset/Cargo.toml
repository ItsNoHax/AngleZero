[package]
name = "anglezero-asset"
version = "0.1.0"
edition = "2021"

# The offline half of the car pipeline. Everything expensive — parsing glTF, simplifying meshes,
# resizing textures — happens here on a development machine, so that the PSP only ever opens a
# finished .azcar. Nothing in this crate is compiled for the console.
[[bin]]
name = "anglezero-asset"
path = "src/main.rs"

[dependencies]
# The game core, for the .azcar layout. Depending on it rather than restating the format is the
# point: the writer and the console's reader are the same constants and the same records, and the
# converter runs the reader over its own output before writing it out.
angle-zero = { path = "../.." }
gltf = { version = "1.4", features = ["import", "extras"] }
meshopt = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
