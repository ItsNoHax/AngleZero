[package]
name = "angle-zero"
version = "0.1.0"
edition = "2021"

[features]
# On-device diagnostics: the debug overlay, SELECT-to-capture, and the emulator screenshot hook
# the headless preview relies on. Off by default so shipping builds carry none of it — but it is a
# feature rather than `debug_assertions`, because the tooling is most useful on hardware and
# hardware builds are release builds.
devtools = []

[lib]
name = "angle_zero"
path = "src/lib.rs"

[[bin]]
name = "angle-zero"
path = "src/main.rs"
test = false

# The game core is target-agnostic `no_std` so it can be unit-tested on the host.
[dependencies]
libm = "0.2"

# Only the binary shell touches the PSP SDK, so host `cargo test` never builds it.
[target.'cfg(target_os = "psp")'.dependencies]
psp = "0.3.11"
