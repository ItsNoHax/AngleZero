# The game is the workspace root and the only default member, so a bare `cargo build` — which is
# what `cargo psp` runs underneath — still builds nothing but the PSP binary. The asset tool is a
# host program with host dependencies and would not survive being built for `mipsel-sony-psp`.
# Reach it explicitly: `cargo run -p anglezero-asset`, `cargo test --workspace`.
[workspace]
members = [".", "tools/anglezero-asset"]
default-members = ["."]

[package]
name = "angle-zero"
version = "0.3.0"
edition = "2021"

[features]
# On-device diagnostics: the debug overlay, SELECT-to-capture, and the emulator screenshot hook
# the headless preview relies on. Off by default so shipping builds carry none of it — but it is a
# feature rather than `debug_assertions`, because the tooling is most useful on hardware and
# hardware builds are release builds.
devtools = []

# A reproducible, self-driving run for the automated glitch hunt: fixed frame delta, input replayed
# from a script keyed to the frame counter, and a burst of consecutive frames captured to the
# memory stick (which under PPSSPPHeadless is a host directory). Implies `devtools` because it is
# built on the same capture and trace plumbing. Never ship this — it ignores the controller.
harness = ["devtools"]

[lib]
name = "angle_zero"
path = "src/lib.rs"

[[bin]]
name = "angle-zero"
path = "src/main.rs"
test = false

# The game core is target-agnostic `no_std` so it can be unit-tested on the host.
[dependencies]
libm = "0.2"

# Only the binary shell touches the PSP SDK, so host `cargo test` never builds it.
[target.'cfg(target_os = "psp")'.dependencies]
psp = "0.3.11"
