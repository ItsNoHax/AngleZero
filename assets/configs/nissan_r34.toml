# Nissan Skyline GT-R V-Spec II Nür (R34) — 1,500 nodes and 495 meshes, the most fragmented model
# in the set by a wide margin.
#
# The fragmentation is all in the wheels: 188 parts wearing the rim material, 148 the brake disc,
# 52 the caliper. A rim modelled as one part per spoke, per bolt, per lip, four times over. None of
# that matters to the config — the patterns below take all 388 of them at once — but it is why this
# is the one car whose part list is worth having read before trusting a triangle count.

name = "Nissan R34 GT-R"

# Same odd units as the Golf and the S15: 0.046 across the box, 4.60 m at 100x, which is a real
# R34's length to the centimetre.
scale = 100.0

triangles = 24000
lods = [3000, 1200]

[wheels]
# Every wheel part carries its material in its node name, which is what makes 388 of them one
# pattern. `TNRRims` covers the rim, the tyre and the disc; the calipers are named separately and
# in two spellings, one of which is not `Calliper`.
#
# Note what `TireBlur` is on this model. On the S15 the same 5,900-triangle mesh is called
# `Tire1A1` and is plainly the tyre; here it is the only tyre-like geometry there is, so it is the
# tyre under a name inherited from wherever it was lifted from. Dropping it as a blur artefact —
# which is the right call for the W201's `EXT_Rim_Blur` — would leave this car on bare rims.
match = ["TNRRims", "Calliper", "calipers_"]

[reduce]
# 188 parts in a rim is a problem the second allocation pass makes worse before it makes it better:
# each one is measured, each one is under its share, and the surplus goes to whatever can still
# spend it. Weighting the corner up keeps the spokes from closing, which on a five-twin-spoke
# BBS-alike is the whole look of the car.
#
# 1.8 was not enough — it bought 450 triangles a corner at 6.5% error, which the converter flagged
# as losing its shape on all four. 2.6 is where the flag clears.
wheel = 2.6

# The tyre is one 2,795-triangle mesh a corner and it was coming out at 165, which is a sidewall
# with a visible seam down it. The budget is there: this car spends 10,245 of 15,000.
tyre = 2.5

# Interior is 47,234 triangles under one material, second only to the paint, and none of it is
# visible at night from behind the car.
interior = 2.0

# The RB26 under the bonnet, at 39,023 triangles the fourth largest thing on the car and never once
# on screen. Same argument as the Golf's `SM_Engine`, and the same reason the visibility sweep does
# not catch it: the bonnet is modelled as a panel that opens, so from 72 viewpoints the engine is
# genuinely visible. It is only invisible because of something the sweep cannot know, which is that
# this game never opens it.
drop = ["Engine_Geo"]

light = 8.0
chrome = 8.0

[materials]
# One long prefix on nearly everything — `Nissan_SkylineGTRR34TNR0_2002` — with the useful word at
# the end. Matching on the tail is what keeps these patterns readable.
light = ["LightA", "red_glass", "orange_glass"]
window = ["Window_Mat", "glass_surr"]
interior = ["InteriorA", "EngineA", "Carbon1"]
chrome = ["Calliper", "Grille", "Manufact", "BadgeA", "Textured"]
tyre = ["TireBlur"]
body = ["PaintTNR", "Base_Mat", "Coloured"]

[handling]
# 1560 kg, 2.665 m between the axles, and four-wheel drive with a rear bias that the real car's
# reputation is entirely about. The quickest thing in the set and, unlike the Golf, one that will
# still rotate — which makes it the car that scores well without being easy.
mass = 1560.0
front_axle = 1.17
rear_axle = 1.49
engine = 10100.0
top_speed = 62.0
brake = 12500.0
steer_lock = 0.58
grip = 1.08
