# Honda Civic EJ coupe with the ViS Racing kit.
name = "Honda Civic EJ"
source = "1993_honda_civic_coupe_vis_racing_fast__furious.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
# `_Ca` was here for the callipers and was a bad pattern: it also matches `_CarPaint`, so bodywork
# was swallowed into the front wheels. The damage is visible in the numbers — the front hubs sat at
# x = ±0.43 against the rears' ±0.74, and the front "wheels" measured 0.86 m wide against 0.24 —
# because a hub is the centre of everything matched, and body panels reach the centreline. In game
# those panels would have turned with the steering.
match = ["Wheel1A", "Calliper"]

[reduce]
# Shipped on a display plinth. The doubled name is what distinguishes it from bodywork — this
# exporter calls a panel's own mesh `<Part>_Base_Geo_lodA`, so a plain `Base_Geo` would take the
# body with it.
drop = ["Base_Geo_lodA_Base_Geo_lodA"]
