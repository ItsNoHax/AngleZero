# Honda Civic EJ coupe with the ViS Racing kit.
name = "Honda Civic EJ"
source = "1993_honda_civic_coupe_vis_racing_fast__furious.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
# `_Ca` was here for the callipers and was a bad pattern: it also matches `_CarPaint`, so bodywork
# was swallowed into the front wheels. The damage is visible in the numbers — the front hubs sat at
# x = ±0.43 against the rears' ±0.74, and the front "wheels" measured 0.86 m wide against 0.24 —
# because a hub is the centre of everything matched, and body panels reach the centreline. In game
# those panels would have turned with the steering.
match = ["Wheel1A", "Calliper"]

[reduce]
# `Base_Geo_lodA_Base_Geo_lodA` was dropped here as a display plinth, and it is not one: it is the
# car's floor and inner wheel arches (4,501 black triangles, inside the car's own footprint — the
# model's bounding box reaches no lower and no wider than the wheels). Dropping it left the car
# open from below straight into the cabin, and showed the background through the arches behind
# the front tyres. Nothing on this model needs dropping.

# Every lamp on this car is one part. `Light_Geo_lodA` is a single 12,108-triangle mesh holding the
# headlights and the tail lights together, centred on the car's origin, and `LightEmissive_Geo` is
# another just like it. The detector splits a lamp part into left and right by which side of the
# centreline each half falls on, which cannot separate front from rear — so with nothing to go on it
# fell back to position and put all four lamps within half a metre of the middle of the car, on a
# car that runs from z = -2.31 to +2.20.
#
# There is no node to name that means "the front half of the light mesh", so these are placed by
# hand. Measured off the bodywork: the nose is at +2.20 and the tail at -2.31, and an EJ coupé
# carries its headlights low and its tail lights high.
# The heights are calibrated rather than guessed: across the 40 lamps in this fleet that the
# converter measured off real lens geometry, headlights sit at about 44% of a car's height and
# tail lights at about 57%. These were eyeballed higher than that at first, outside the range
# every measured car falls in, which is the only cross-check available when a model gives you
# no lens to measure.
[lights.headlight_left]
at = [0.62, 0.60, 2.02]
radius = 0.30
[lights.headlight_right]
at = [-0.62, 0.60, 2.02]
radius = 0.30
[lights.tail_left]
at = [0.60, 0.77, -2.16]
radius = 0.28
[lights.tail_right]
at = [-0.60, 0.77, -2.16]
radius = 0.28
