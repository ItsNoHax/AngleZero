# BMW 3-Series E36 — the first car through the pipeline.
#
# Everything the converter can work out for itself is absent from this file on purpose. It measures
# the wheel radius, grounds the car, centres the wheelbase, and sorts 57 materials into six
# categories from their names and their numbers. What is left is the one question the model does
# not answer: which of its 298 parts are wheels.
#
# `anglezero-asset inspect --deep assets/source/bmw_3-series_e36.glb` is how these were found.

name = "BMW E36"

# Lands at 13,847, and where the last 1,150 do not go is the interesting part.
#
# The bodywork saturates at about 3,600 triangles. Sweeping the budget from 5,000 to 40,000 moves
# it from 2,616 to 4,876 and no further, because past that point the converter can already draw
# every panel within five millimetres of the original and refuses to spend more on something it
# cannot improve. Five millimetres is well under a pixel at any distance the car is seen from.
#
# The wheels and the glass are the opposite: surfaces of revolution and flat sheets take every
# triangle offered. The converter shares the budget out twice for exactly this reason — the second
# pass hands what the body could not use to whatever can — so the weights below are about which of
# those gets it, not about squeezing the body.
#
# 15,000 is where it stops paying: the remainder is spread across categories that have all reached
# the point where more does not show at 480x272.
triangles = 15000

# No `[handling]` table on purpose. The descent was tuned around a 1420 kg saloon and this is that
# saloon, so the E36 takes the defaults — and a car that says nothing about how it drives is the
# case most worth having an example of. `toyota_ae86.toml` is the other one.

# Coarser copies of the whole car, for when it is not the one being driven. The plan's shape:
# LOD0 for the player, LOD1 for a car a few lengths away, LOD2 for anything far enough back that
# it is a hundred pixels wide. Each is decimated from the welded original rather than from the
# level above, so LOD2 carries one decimation's error instead of three.
lods = [4500, 1800]

[reduce]
# Wheels and brightwork pull against each other, because the alloys and the bumper trim are both
# bright metal and share a category. `chrome` lifts both; `wheel` lifts only what is bolted to a
# corner. Moving them in opposite directions is what separates them: the trim goes from 50
# triangles at 15.1% error to 221 at 5.3%, and the wheels keep theirs.
#
# Past this the tyres fall off a cliff — chrome 20 with wheel 1.2 leaves them 69 triangles each,
# which is a hexagon.
wheel = 1.5

# Headlights and tail lamps are the other thing that says which car this is, and everything else
# here takes their share unless they are held up too: raising `wheel` on its own once took the
# lamps from 279 triangles to 74, which the converter warned about.
light = 10.0

# Bumper trim, window surrounds, exhaust tips, badge surrounds. Thin strips, so the visibility
# sweep measures very few pixels of them and the budget follows — see `wheel` above for why this
# number is as high as it is.
chrome = 12.0

# Within a corner, which of its parts the budget is for.
#
# The alloy and the brake hardware behind it are both bright metal, so they land in the same
# category and then compete on measured pixels — which the hardware wins, through the gaps between
# the spokes, at the expense of the wheel in front of it. Left to that, the alloy fell to about 150
# triangles and its spoke windows closed, which is the first thing an edge collapse does.
#
# The hardware is not worthless — it is what the gaps show, and the caliper is the only colour in
# the wheel — but it is worth a few hundred triangles a corner rather than two thousand. The
# `amdb11_` prefix is not a typo: the discs were lifted from an Aston Martin DB11 and the names
# came with them.
[reduce.parts]
wheel_bmw_aplg = 6.0
amdb11_brakedisc = 0.4

[wheels]
# Each corner is three assemblies with three unrelated names, and all of them must turn together:
#   Object_4.001-.004         the tyres, 13,166 triangles each
#   wheel_bmw_aplg_16x7*      the alloys
#   amdb11_brakedisc_FR.00*   the disc and caliper, named after the car they were lifted from
# Which corner each one is comes from where it sits, not from these names — .001 is a rear wheel
# and .003 is a front one, so the numbering says nothing.
#
# The trailing dot on `Object_4.` matters: without it this also matches Object_35.001, a seat.
match = ["wheel_bmw_aplg", "Object_4.", "amdb11_brakedisc"]
