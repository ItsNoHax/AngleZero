# BMW 3-Series E36 — the first car through the pipeline.
#
# Everything the converter can work out for itself is absent from this file on purpose. It measures
# the wheel radius, grounds the car, centres the wheelbase, and sorts 57 materials into six
# categories from their names and their numbers. What is left is the one question the model does
# not answer: which of its 298 parts are wheels.
#
# `anglezero-asset inspect --deep assets/source/bmw_3-series_e36.glb` is how these were found.

name = "BMW E36"
source = "bmw_3-series_e36.glb"

# The bodywork saturates at about 3,600 triangles. Sweeping the budget from 5,000 to 40,000 moves
# it from 2,616 to 4,876 and no further, because past that point the converter can already draw
# every panel within five millimetres of the original and refuses to spend more on something it
# cannot improve. Five millimetres is well under a pixel at any distance the car is seen from.
#
# The wheels and the glass are the opposite: surfaces of revolution and flat sheets take every
# triangle offered. The converter shares the budget out twice for exactly this reason — the second
# pass hands what the body could not use to whatever can — so the weights below are about which of
# those gets it, not about squeezing the body.
#
# This said 15,000 for a long time, on the grounds that the remainder went to categories where more
# does not show at 480x272. That was true of the *categories* and false of two parts inside them:
# at 15,000 the kidney grille had about forty triangles and drew as black shards, and the alloys had
# 560 and cut into their own tyres.
#
# 24,000 rather than the 30,000 those two first needed, because `simplify.rs` no longer lets the
# free-error pass flatten a small part — which was costing more detail than the budget was. See
# `docs/cars.md`, "Why the budget is 24,000 and not 15,000".
triangles = 24000

# No `[handling]` table on purpose. The descent was tuned around a 1420 kg saloon and this is that
# saloon, so the E36 takes the defaults — and a car that says nothing about how it drives is the
# case most worth having an example of. `toyota_ae86.toml` is the other one.

# Coarser copies of the whole car, for when it is not the one being driven. The plan's shape:
# LOD0 for the player, LOD1 for a car a few lengths away, LOD2 for anything far enough back that
# it is a hundred pixels wide. Each is decimated from the welded original rather than from the
# level above, so LOD2 carries one decimation's error instead of three.
#
# These were 4,500 and 1,800, which between them was 30% of the file — spent on a car eighteen
# metres away. Trimming them is what paid for LOD0's raise.
lods = [3000, 1200]

[reduce]
# Wheels and brightwork pull against each other, because the alloys and the bumper trim are both
# bright metal and share a category. `chrome` lifts both; `wheel` lifts only what is bolted to a
# corner. Moving them in opposite directions is what separates them: the trim goes from 50
# triangles at 15.1% error to 221 at 5.3%, and the wheels keep theirs.
#
# Past this the tyres fall off a cliff — chrome 20 with wheel 1.2 leaves them 69 triangles each,
# which is a hexagon.
wheel = 1.5

# The tyres, held up against `chrome` above rather than against the budget. These two pull on each
# other harder than any other pair in this file: `chrome` is what the alloys and the bumper trim
# share, and left at 12.0 with nothing opposing it the tyres fall to about 170 triangles a corner —
# a coarse ring that the alloy inside it then cuts across. At 3.0 they are 464 at 2.9% error, which
# is what the rest of the car manages, and the trim keeps its own.
tyre = 3.0

# The cabin, which is seen through the glass from the chase camera for the whole descent. Left
# unweighted it took 433 triangles at 15.5% error — by a distance the worst figure this car
# produced, and visible as a seat that is no longer seat-shaped. 4.0 brings it to 1.98%, in line
# with the bodywork, for about 3,000 triangles the body could not have used anyway.
interior = 4.0

# Headlights and tail lamps are the other thing that says which car this is, and everything else
# here takes their share unless they are held up too: raising `wheel` on its own once took the
# lamps from 279 triangles to 74, which the converter warned about.
light = 10.0

# Bumper trim, window surrounds, exhaust tips, badge surrounds. Thin strips, so the visibility
# sweep measures very few pixels of them and the budget follows — see `wheel` above for why this
# number is as high as it is.
chrome = 12.0

# Within a corner, which of its parts the budget is for.
#
# The alloy and the brake hardware behind it are both bright metal, so they land in the same
# category and then compete on measured pixels — which the hardware wins, through the gaps between
# the spokes, at the expense of the wheel in front of it. Left to that, the alloy fell to about 150
# triangles and its spoke windows closed, which is the first thing an edge collapse does.
#
# The hardware is not worthless — it is what the gaps show, and the caliper is the only colour in
# the wheel — but it is worth a few hundred triangles a corner rather than two thousand. The
# `amdb11_` prefix is not a typo: the discs were lifted from an Aston Martin DB11 and the names
# came with them.
[reduce.parts]
# The face of the car, and the three parts that make it one.
#
# All of this is inside `body`, which decimates 255,077 source triangles to about 6,600 — a ratio
# of forty to one that a door skin survives and a lattice does not. Shared out on measured pixels
# alone the front of the car loses every time, because a grille slat and a mesh square are a pixel
# each from where the camera stands and a wing is a thousand.
#
#   E36_coupe_grille      the kidney grille, its slats, and the panel 17 cm behind it. Without
#                         this the grille is a dark recess with a few struts in it and there is
#                         nothing behind it at all.
#   E36_coupe_bumper_F    the front bumper's own parts, which is where both foglights are — a lens,
#                         its glass and its surround, about 900 triangles a side.
#   BMWE36_black.008      27,360 vertices against 18,084 triangles, which is the signature of a
#                         part made of hundreds of disconnected little squares: it is the mesh in
#                         the lower bumper opening. Decimated with the bodywork it collapses into
#                         a flat black slab across the opening, which is what "missing the mesh"
#                         was. It needs the quotes — a bare dotted key is a TOML table.
#
# Deliberately not a budget raise. 30,000 draws the same face and costs 122 KB of an arena with
# about 400 KB left in it; what was wrong was the share, not the total.
E36_coupe_grille = 10.0
E36_coupe_bumper_F = 6.0
"BMWE36_black.008" = 6.0

wheel_bmw_aplg = 6.0
amdb11_brakedisc = 0.4

[wheels]
# Each corner is three assemblies with three unrelated names, and all of them must turn together:
#   Object_4.001-.004         the tyres, 13,166 triangles each
#   wheel_bmw_aplg_16x7*      the alloys
#   amdb11_brakedisc_FR.00*   the disc and caliper, named after the car they were lifted from
# Which corner each one is comes from where it sits, not from these names — .001 is a rear wheel
# and .003 is a front one, so the numbering says nothing.
#
# The trailing dot on `Object_4.` matters: without it this also matches Object_35.001, a seat.
match = ["wheel_bmw_aplg", "Object_4.", "amdb11_brakedisc"]

# No `[lights]` table either, and for the same reason there is no `[handling]` one: this car does
# not need to be told. Its lenses are named `fara`, `brakelight` and `E36_lights`, which the
# material sorter has always recognised, and the converter measures where each one is and how big
# it is off the model. `mercedes_190e.toml` is the car that does need telling, and its table is
# what one looks like.
#
# Two things it does say, in warnings rather than in silence: the rear bumper strip and the
# high-level lamp in the back window are single lenses on the car's centreline, and a lamp there
# belongs to no side, so neither is fitted. The pair in the rear cluster does the braking.

# The model says this trim is mid grey. It is black plastic.
#
# `BMWE36_paint.004` is 3,860 triangles at rgba(0.41, 0.41, 0.41), untextured — the lip along the
# bottom of the front bumper, the sills, and the strip under the rear valance. Nothing about that is
# a budget, a category or a UV: the model simply declares a colour, and it draws as a pale grey band
# round the bottom of the car where a black splitter belongs. No weight can move it and no sweep can
# see anything wrong with it.
#
# Found by painting candidates and looking, which is what this rule is best at: give a material a
# colour nothing else on the car has, compile, and the render says which surface wears it.
#
# 95, and it said 28 for as long as this field was being read as linear — which compiled to about
# 95. So 95 is the number that was ever actually on screen and kept; 28 was never seen by anybody.
# When the field started meaning the sRGB it always claimed, the strip went to a true near-black,
# disappeared into the shadow under the bumper, and read as *missing* trim rather than dark trim.
# Dark grey plastic is what an M-Tech lip is. A splitter that cannot be told from the gap under it
# is not an improvement on a pale one.
[[materials.colour]]
match = ["BMWE36_paint.004"]
rgb = [95, 95, 100]
