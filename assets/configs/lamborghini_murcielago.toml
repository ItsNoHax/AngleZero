# Lamborghini Murcielago with the LB Silhouette Works kit.
name = "Lamborghini Murcielago"
source = "2024_lbsilhouette_works_murcielago_gt_evo.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
match = ["Wheel1A", "wSw:"]

[reduce]
# `Base_Geo_lodA_Base_Geo_lodA` is not a plinth: it sits inside the footprint and is the floor and
# inner arches. Dropping it left the underside open to the inside of the bodywork.
# 50,883 source triangles of cabin and engine bay; at the default 0.4 they fell to 504 at 32% error.
interior = 2.0

[materials]
# The cabin and the engine bay wear alpha-tested materials, which read as glass: they went into the
# window category, the visibility sweep saw through them, and the whole interior was dropped.
interior = ["Interior_Geo", "Engine_Geo"]
# `Coloured` is a swatch palette (image9: a grid of flat colour squares), not a picture.
palette = ["Coloured_Material"]
