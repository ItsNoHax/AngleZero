# BMW 5-Series E39 — the E36's sibling, from the same author and built the same way.
#
# Which makes it the cheapest car in the set to configure: `Object_N.001`–`.004` at the four
# corners, exactly as `bmw_e36.toml` describes, so the wheel patterns are the same shape and only
# the numbers change. What it does not share is a vocabulary for its materials — half of them are
# named after what they are made of (`chrome`, `glass`, `weatherstrip`) and half after nothing at
# all (`Scene_-_Root`, `.005`), including the one the alloys wear.

name = "BMW E39"

# 4.77 m across the box against a real E39's 4.775 m. Life size in metres.

# 32,000 where every other car here gets 24,000, and the only car that needs asking for more.
#
# Its bodywork is 131,424 source triangles against the Golf's 91,872 and the 190E's 73,031, because
# this model has the doors, sills and arches as separate shells and puts the black moulding down
# each door in a recess in the door skin. Decimate the shell far enough and the recess walls
# collapse before the strip does, and what is left is a slot straight through the car — you could
# see the cabin, and then the far side of the road, through both doors. It is not a hole any weight
# could close from inside 24,000: the moulding lives in `Object_33`, the 39,638-triangle shell that
# is the largest part on the car, so a part weight has nothing to take it from, and buying it out of
# the category instead put the alloys at 362 triangles apiece.
#
# `Object_33` needs about 11,000 triangles before the recess survives. 24,000 gave it 5,170 and
# 32,000 with the body weight below gives it 11,293. The file goes 736 KB to 861 KB, which the arena
# has room for and which `docs/cars.md` records.
triangles = 32000
lods = [3000, 1200]

[spawn]
# The one car in the set that was modelled facing the other way, and the only thing here that
# cannot be measured off the bounding box — a box is the same either way round. What says so is
# which end the lamps are: this model's headlights sit at z = -2.14 and its tail lights at +1.98,
# where the E36, the AE86, the 190E, the Golf and both Nissans all put headlights at +Z.
#
# Left alone the car drove the whole descent backwards. It looked correct standing still on the
# title screen, because a saloon seen from three-quarters on is a saloon either way round, and it
# was only obvious from the chase camera, which spent the run looking at the car's nose.
yaw = 180.0

[wheels]
# Three assemblies a corner, and the suffix is the corner:
#   Object_4.001-.004    the alloys, 22,558 tris each and the largest thing on the car
#   Object_24.001-.004   the brake disc and its carrier, two meshes sharing a node
#   Object_39.001,.003-.005   the tyre, as tread and sidewall
# The trailing dots matter for the same reason they do on the E36: `Object_4.` must not also take
# `Object_44`, and `Object_39.` must not take the bare `Object_39`, which is a bumper trim in the
# middle of the car. The tyre's numbering skips `.002` — the corners are `.001`, `.003`, `.004`,
# `.005` — which is one more reason not to try to read the corner off the name.
match = ["Object_4.", "Object_24.", "Object_39."]

[reduce]
# The alloys are 22,558 triangles a corner behind a disc and a carrier that between them are 2,200,
# so the E36's problem is here too but milder: the hardware is a tenth of the corner rather than a
# third of it. Held apart the same way.
wheel = 1.5
light = 8.0
chrome = 10.0

# The one car here whose bodywork does not saturate. The E36's panels run out of things to improve
# at about 3,600 triangles and refuse more; the E39's are 131,346 source triangles — a longer car,
# modelled with the doors, sills and arches as separate shells — and at 2,644 they were still at
# 4.5% error, which is four times what every other car in the set manages and the only body figure
# that showed up as a number rather than as a shrug.
#
# 4.5 rather than 1.4, for the door mouldings described where the budget is set. It takes the body
# to 22,210 of the 32,000 and the alloys down from 1,613 triangles to 1,074 at 1.0% error, which is
# a wheel that still reads as a multi-spoke; the face is unchanged side by side, grille slats and
# all. Past about 6 the trade turns: at 12 the body reaches 20,178 out of a 24,000 budget and the
# lamps get 42 triangles between them.
body = 4.5

[materials]
# `Scene_-_Root` is the exporter's name for a material that never had one, and on this model it is
# what the alloys wear — 90,232 triangles of it, all of it at the four corners. Nothing about that
# string says metal, so the guesser has to be told, and it is the single most important line in
# this file: without it the wheels are sorted as bodywork and decimated on the paint's budget.
chrome = ["Scene_-_Root", "chrome", "black_chrome", "metal", "bumper_frame", "emblem"]
tyre = ["tire_protector", "tire_left_L"]
window = ["glass", "window", "black_glass"]
# The lenses, and nothing that merely sits behind one. `reflector` used to be on this line and was
# the single worst entry in the file: it matches `reflector` and `textured_reflector`, which are the
# silvered bowls inside the lamp housings — 10,634 triangles against 1,878 for both rear lenses. A
# category weighted at 8.0 therefore went mostly on bowls, and what was left drew both rear clusters
# as white blobs. The bowls are still drawn; they come out as `chrome`, which is what they are.
#
# `lights_glass` and `detail_glass` are gone with it because they never did anything: `window` is
# asked before `light` and both names contain `glass`, so the lenses this line meant to name were
# already being sorted as windows.
light = ["head_light", "tail_light"]
interior = ["bump_leather", "cloth", "mottled", "gauge", "bump_plastic"]

# `rubber_trim` is not a tyre. It is 5,652 triangles of window seal and roof channel sitting at
# y = 0.99 in the middle of the car, and the guesser took the word `rubber` at face value and put
# it in with the wheels — where it was decimated on a tyre's budget to 102 triangles at 53% error,
# by some distance the worst number this model produced. `weatherstrip` is the same part of the car
# under a name that does not read as rubber, which is why only one of the two went wrong.
body = ["rubber_trim", "weatherstrip"]

[handling]
# A 540i: 1600 kg, 2.83 m between the axles, and the 50/50 the marketing was about. The heaviest
# car in the set and the one with the least steering lock — it carries speed and resents being
# asked to change direction, which on a descent scored by slides is a genuinely different problem
# from the AE86's.
mass = 1600.0
front_axle = 1.40
rear_axle = 1.43
engine = 9000.0
top_speed = 62.0
brake = 12000.0
steer_lock = 0.55
grip = 1.00
