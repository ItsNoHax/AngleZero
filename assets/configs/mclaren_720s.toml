# McLaren 720S with the LB-Works kit. CC-BY rather than non-commercial.
name = "McLaren 720S"
source = "2017_mclaren_720s_lbworks.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
match = ["TNRRims"]

# The wheel's heaviest part is the spoked Rim109A mesh, so the position rule made it the tyre and
# sent the real tyre (TireBlur) to chrome. Say which is which.
[materials]
tyre = ["TireBlur"]
chrome = ["Rim109A"]

# The tyre is an open shell that only just meets the rim lip; decimated below ~1,000 triangles a
# wheel, its inner edge turns to chords and the background shows through a ring at the rim.
[reduce]
tyre = 2.0
# The wheel-arch liners are the inside of the Kit2 paint shell, seen from behind; culled, the
# background showed in a sliver between the rear tyre and the arch. Two-siding Base, Carbon1,
# Coloured, Carbon1M or Engine did not fill it (each rendered); Paint did.
two_sided = ["_Kit2_Paint_Geo"]
