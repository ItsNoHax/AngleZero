# Nissan Silvia S14 Kouki with the Vertex Ridge kit.
name = "Nissan S14"
source = "2018_vertex_ridge_s14_silvia_kouki.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
match = ["wheels_rb", "Wheel1A", "Rim_C1", "Rim_B_1"]

[materials]
# Inside a wheel the heaviest part is taken for the tyre, and here that is the five-spoke rim
# (`Rim_C1`, 3,742 triangles against the tyre's 1,232), so both are named. The tyre nodes are
# spelt with their `_m` suffix because `polySurface15` alone also matches the callipers'
# `polySurface1507`.
chrome = ["Rim_C1"]
tyre = ["polySurface15_m", "polySurface30_m", "polySurface35_m", "polySurface36_m"]
# The cabin's material is flagged transparent, so it fell into `window` with the glass, was cut to
# a window's share and blended: with the glass hidden the car was a hollow shell.
interior = ["M_Interior_Max"]

# With the rims joined to their wheels, each wheel's hardware outweighs its tyre on screen, and
# at LOD2 the tyre was starved into a square slab. Weighting tyres up keeps them round.
[reduce]
tyre = 2.0

# The body's chrome — the headlamp buckets and projectors, the grille surround and the brake ducts
# at the bumper corners (`AluminumBlackRough`, one part) — shared 270 triangles, and the duct part
# collapsed at 43% error into one black wedge drawn across the front, with the grille surround gone
# and the headlamps a smear of reflector texture. `chrome = 4` held them but made each wheel 2,220
# triangles and cut the body to 7,842. `trim` weights the body's chrome alone and leaves the rims
# at `chrome × wheel`; at 4 the call gets ~1,160 and the headlamps show their projectors.
#
# Inside the call the headlamps still outbid the ducts, which stay on a cliff: 193 triangles at 45%
# error, 390 at 2.6%. The part weight below puts them over it (and takes the exhaust tips,
# `AluminumRough`, from 14 triangles to 230 with them).
trim = 4.0
# Held up by 0.05 because the cabin sits on a cliff of its own: the ~250 triangles the trim takes
# from it at 0.4 drop it from 938 at 12% error to 698 at 19%. At 0.45 it is 1,144 at 5.8%.
interior = 0.45

# `M_Chassis_Max` is flagged transparent and stays in `window`, and it carries the intercooler and
# the piping seen through the bumper's intakes. With the cabin moved out of `window` it lost the
# share it used to get alongside it, the piping decimated away and the intakes showed background.
[reduce.parts]
"M_Chassis_Max" = 2.0
"Opaque_Aluminum" = 5.0

# This model names nothing. Every one of its twenty-two materials is a Maya default —
# `SILVIAphong2SG1`, `SILVIAphong6SG1` and so on — so the category guesser, which works from names,
# had nothing to sort on and put no part in the `light` category at all. The car compiled with no
# headlights and no tail lights, which in a game that is entirely set at night is not a small thing.
#
# Identifying which phong is the lens would mean rendering all twenty-two and looking at them, and
# it is not needed for the lamps to work: the runtime draws a lamp at the anchor it is given. So
# these are placed by hand off the bodywork — the nose is at z = +2.26 and the tail at -2.30, and
# an S14 Kouki carries slim headlights low at the corners and tall tail lights.
#
# What this does not buy is the lens *geometry* lighting up, only the glow in front of it. If this
# car ever looks like it is projecting light from nowhere, the fix is `[materials] light` naming the
# right phong, which someone will have to find by rendering them one at a time.
# The heights are calibrated rather than guessed: across the 40 lamps in this fleet that the
# converter measured off real lens geometry, headlights sit at about 44% of a car's height and
# tail lights at about 57%. These were eyeballed higher than that at first, outside the range
# every measured car falls in, which is the only cross-check available when a model gives you
# no lens to measure.
[lights.headlight_left]
at = [0.66, 0.56, 2.10]
radius = 0.30
[lights.headlight_right]
at = [-0.66, 0.56, 2.10]
radius = 0.30
[lights.tail_left]
at = [0.66, 0.71, -2.18]
radius = 0.28
[lights.tail_right]
at = [-0.66, 0.71, -2.18]
radius = 0.28
