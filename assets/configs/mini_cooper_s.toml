# Mini Cooper S, F56, 2014. The shortest car in the fleet at 3.8 m — a hatchback among saloons and
# coupes, so it should look small on the grid rather than look wrong.

name = "Mini Cooper S"
source = "2014_mini_cooper_s_f56.glb"

# The model is 0.039 units long — no unit anyone would name, so 100 was a guess off the bounding box
# and the conversion report settled it: 3.86 m against a real F56's 3.821, and wheels measured at
# 0.312 m against the 0.308 a 205/45 R17 actually stands at. Both inside 1%, so the guess was right
# and there is nothing to correct.
scale = 100.0

triangles = 24000
lods = [3000, 1200]

[wheels]
# Four parents named `3DWheel Front L` and so on, each holding one part with rim and tyre together.
# `3DWheel` rather than `Wheel`, which would also take `Wheel1A_3D_00` — the group node above all
# four — and the two words are not the same thing even where the result would be.
match = ["3DWheel"]

[materials]
# The tail lamp lens is `red_glass`, rgba(0.5, 0, 0, 0.25): a quarter-opaque dark red. As glass it
# blends at the window floor of 35% over the silver reflector behind it, and a silver lamp seen
# through a faint red film is pale pink, which is what both clusters were. An F56's tail lamps read
# solid red. As a lamp, the lens is opaque and lit at its own hue. Its other piece is the red
# reflector strip in the rear bumper, which is red on the real car too.
light = ["red_glass"]

# The reversing lamps, placed rather than derived.
#
# Nothing in the model names them, so they would otherwise be inferred from the tail lamps: inboard
# of them, level with them, a little further back. That is the E39's layout and it is wrong for this
# car. The F56 puts its reversing lamp in the Union Jack cluster itself, as the small clear notch
# across the bottom of the lens — and the model has it, as a separate piece of clear glass at
# y = 0.717..0.736 on the back face of the red lens, 12 cm wide.
#
# Given as positions rather than as `node`, because a node fragment names a whole part and this one
# is a scrap of the car's window mesh: the fragment would match the windscreen too.
[lights.reverse_left]
at = [0.634, 0.727, -1.690]
radius = 0.11

[lights.reverse_right]
at = [-0.634, 0.727, -1.690]
radius = 0.11

# The headlamp lens is `glass_light`, rgba(0, 0, 0, 0.55): black glass at over half opacity. In the
# PBR renderer it was made for, its clearcoat reflects the sky and the lamp reads bright. Here glass
# is only its colour, so a black lens drew a dark grey ring. A real F56 lamp reads silver and white
# through clear glass, so the lens gets a pale tint instead.
[[materials.colour]]
match = ["glass_light"]
rgb = [215, 218, 224]

# The headlamp bezels. `LightA` is chrome by metalness (0.83), not by colour: the ring samples a
# dark disc of `image23`, grey 38 of 255, which the renderer it was made for would have shown
# reflecting the sky. Here it is only its base colour, so each lamp drew with a dark ring round it
# where an F56 has a chrome one. `flat = true` threw away the lamp's own detail with it (the same
# image), so the lift is boxed to that disc: u 0-0.27, v 0.37-0.70, which only the two bezels
# sample. 3 takes it to 114, a silver that still leaves the lens paler than the ring.
[[materials.lift]]
match = ["LightA"]
by = 3.0
uv = { min = [0.0, 0.37], max = [0.27, 0.70] }

[reduce]
# Once the ring is pale it is no longer hidden against the black paint, and at the default weight
# (761 triangles for all the lamps) it came out an octagon. At 4 the lamps get 1,819, the ring is
# round and the projector behind the lens shows; the body pays 10,784 -> 10,297 at 0.13 -> 0.14%.
light = 4.0
