# BMW E30 with the Pandem widebody kit. CC-BY rather than the non-commercial licence most of this
# fleet carries.
name = "BMW E30 Pandem"
source = "2017_pandem_bmw_e30_v1.5_bodykit.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

[wheels]
# Three rim materials — `crome_rim`, `rim_B`, `rim_C_2` — under `off1_`/`off2_` nodes, plus the
# tyre under the model's `Wheel1A` group. `_rim` rather than `rim` so it cannot reach anything that
# merely ends in those letters, and nothing here is called `SteeringWheel`, which `Wheel` alone
# would have taken.
match = ["_rim", "Wheel1A"]

[reduce]
drop = ["Callip"]
# The cabin, once it is `interior` (below): at the default weight its 5,592 triangles fell to 1,812
# and the steering wheel to a sliver. Doubled, it is 5,592 kept whole, with the round wheel and the
# textured seats, and the tyres give up 32 triangles each for it without visibly changing.
interior = 2.0
# The grille, kidneys and mirrors are black plastic, but their nodes are called `..._ChromeSmooth_..`,
# so they sort as brightwork and share the small `chrome` draw call: the 3,108-triangle slat lattice
# got 121 and the kidney surrounds 20, which is what drew the black triangles across the grille.
# A `[reduce.parts]` weight cannot help, because it only reshuffles triangles inside a draw call.
# `trim` triples the body's chrome call alone and leaves the rims and tyres at their defaults. This
# used to be `chrome = 3`, `tyre = 3` and `wheel = 4 / 3`, which came to the same weights on the
# rims and tyres but also cut the wheels' `window` centre caps to a third (40 -> 24 triangles).
trim = 3.0
# Lamps: the chrome rings round the headlamps and the reflector dishes behind them. At the default
# the rings fell to 14 triangles and cut across the inner lamps as a star; at 12 the whole 804 of
# the lamps costs about 570 more triangles and is kept nearly whole (the reflector at 128 of 128,
# which the colour rule below needs, since it paints the dish's centre vertex).
light = 12.0

[reduce.parts]
"Light_Max_005" = 12.0
# The front bumper's lower paint panel is what frames the black slot under the number plate, and
# it sits on a knife edge: at 171 triangles the slot is open, at 170 its top edge folds down over
# it. Moving to `trim` (above) shifted the body by 35 triangles and took one of them. 1.1 gives it
# 187 and the slot stays open.
"BumperChassisF6_Mesh_M_Chassis_Max_BMW:M_CarPaint" = 1.1

# The seats, dashboard and steering wheel wear `BMWM_Interior_Max1`, which carries an alpha channel,
# so by default they went to `window` and were decimated as glass. This used to take the cabin out
# of the silhouette (15.8% missing from the side, against 0.3%) and was held back for it; the
# silhouette is now built from every part, whatever it is called.
[materials]
interior = ["BMWM_Interior_Max1"]

# The inner (high-beam) headlamps. `BMWM_Light_Max1` paints them a flat grey in the image, because
# the model makes them a mirror dish with its normal and metal maps, and the console has neither, so
# they drew as flat grey discs next to the textured outer lamps. The dish's one centre vertex, at
# x = ±0.40, is painted dark and the colour fades to the rim, which reads as the reflector and bulb.
# The box is thin in y and z so that it holds that vertex and nothing else of the material: the rim
# is 2 cm further forward, and the outer lamps sit outside |x| = 0.42.
[[materials.colour]]
match = ["BMWM_Light_Max1"]
rgb = [40, 40, 46]
inside = { min = [-0.42, 0.519, 1.85], max = [0.42, 0.535, 1.935] }
