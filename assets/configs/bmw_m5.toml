# BMW M5 saloon, 2025.
name = "BMW M5"
source = "2025_bmw_m5_sedan.glb"

scale = 100.0
triangles = 24000
lods = [3000, 1200]

# The longest car in the fleet at 5.09 m, and the clustering grid is sized by the triangle
# target, so the default 1,000 rounds its sills away — 3.9% of the car missing against a median of
# 0.1%. At 1,400 it is 0.3%, for about two extra kilobytes.
silhouette = 1400

[wheels]
match = ["SedanRewardRecycled_2024_Wheel"]

[reduce]
# Shipped on a display plinth. The doubled name is what distinguishes it from bodywork — this
# exporter calls a panel's own mesh `<Part>_Base_Geo_lodA`, so a plain `Base_Geo` would take the
# body with it.
drop = ["Base_Geo_lodA_Base_Geo_lodA"]
