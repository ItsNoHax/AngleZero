title = "Angle Zero"

# XMB presentation. Both PNGs are 24-bit (no alpha) — the source art is RGBA, and some firmwares
# and packers reject an alpha channel here, so `assets/` holds the converted copies.
xmb_icon_png = "assets/ICON0.png"
xmb_background_png = "assets/PIC1.png"

# XMB background music: a 20 s loop as ATRAC3 LP2 (132 kbps, 44.1 kHz stereo). Nothing packaged
# can produce this — ffmpeg has decoders for ATRAC3 but no encoder — so it is generated by
# `scripts/encode_music.sh`, which builds atracdenc from source. The result is committed because
# regenerating it means building two projects.
xmb_music_at3 = "assets/SND0.AT3"
