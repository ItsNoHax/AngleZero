title = "Angle Zero"

# XMB presentation. ICON0 and PIC1 are 24-bit (no alpha) — the source art is RGBA, and some
# firmwares and packers reject an alpha channel here, so `assets/` holds the converted copies.
# PIC0 is the info panel the XMB draws over PIC1; it keeps its alpha, as the slot allows.
xmb_icon_png = "assets/ICON0.png"
# The animated icon the XMB plays while the game is selected, generated from ICON1_source.mp4 by
# `scripts/make_pmf.py` and committed, so a build needs no encoder.
xmb_icon_pmf = "assets/ICON1.PMF"
xmb_background_png = "assets/PIC1.png"
xmb_background_overlay_png = "assets/PIC0.png"

# XMB background music: a 20 s loop as ATRAC3 LP4 (66 kbps, 44.1 kHz stereo). Nothing packaged
# can produce this — ffmpeg has decoders for ATRAC3 but no encoder — so it is generated by
# `scripts/encode_music.sh`, which builds atracdenc from source. The result is committed because
# regenerating it means building two projects.
xmb_music_at3 = "assets/SND0.AT3"
